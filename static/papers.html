<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8200ee"><meta name="description" content="Search arXiv research papers by topic, title or author. Filter dates, save papers and open the original PDF."><title>Explore papers · Easy ArXiv</title><link rel="icon" href="/static/brand.svg?v=book-2" type="image/svg+xml"><link rel="stylesheet" href="/static/css/app.css"><link rel="stylesheet" href="/static/css/refinements.css?v=source-1"><link rel="stylesheet" href="/static/css/search-ui.css"><script src="/static/js/papers.js" defer></script><script src="/static/js/app.js?v=github-2" type="module"></script></head><body data-page="papers"><a class="skip-link" href="#main">Skip to papers</a><div data-site-header></div><main class="container catalog-main" id="main"><a class="back-link" href="/"><span data-icon="back"></span>Back to home</a><div class="catalog-heading"><div><h1 class="page-title">Explore research on arXiv</h1><p class="page-description">Find a paper. Open the original. Make it your next idea.</p></div><a class="text-link" data-auth-only hidden href="/saved"><span data-icon="bookmark"></span>Saved papers <span data-saved-count></span></a></div><section class="search-panel" aria-label="Search papers"><div class="search-panel-body"><form class="research-search" role="search" novalidate><div class="search-form-row"><div class="search-input-wrap"><span data-icon="search"></span><input type="search" id="searchInput" name="q" placeholder="Topic, paper title or arXiv PDF link…" autocomplete="off" aria-label="Search research papers" aria-describedby="searchError"><button class="icon-button" type="button" data-search-filters aria-label="Open search filters"><span data-icon="filter"></span></button></div><button class="btn btn-primary" type="submit">Search papers</button></div><p class="form-error" id="searchError" role="alert" hidden></p></form><div class="search-examples"><span>Try</span><button data-topic="artificial intelligence">Artificial intelligence</button><button data-topic="quantum computing">Quantum computing</button><button data-topic="machine learning">Machine learning</button></div></div></section><section aria-labelledby="resultsHeading"><div class="results-tools"><div><h2 id="resultsHeading">Recent papers</h2><span id="resultSummary" role="status" aria-live="polite"></span></div><div class="results-tools-right"><label class="select-label">Sort<select id="sortBy" aria-label="Sort papers"><option value="relevance">Relevance</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label><button type="button" class="filter-button" id="dateToggle" aria-expanded="false" aria-controls="dateFilters"><span data-icon="filter"></span>Dates</button></div></div><form class="date-filters" id="dateFilters" hidden><label>Published after<input type="date" id="dateFrom" name="from"></label><label>Published before<input type="date" id="dateTo" name="to"></label><button type="submit" class="btn btn-primary btn-small">Apply dates</button><button type="button" class="text-link" id="clearDates">Clear</button><p class="form-error" id="dateError" role="alert" hidden></p></form><div class="paper-list catalog-papers" id="paperResults" aria-busy="true"><div class="loading-state"><span class="spinner" aria-hidden="true"></span>Finding research papers…</div></div><div class="load-more" id="pagination" hidden><button class="btn btn-secondary" type="button" id="loadMore">Show more papers</button><p class="results-announcement" id="pageCount"></p></div></section></main><div data-site-footer></div><noscript><p class="container">Enable JavaScript to search arXiv.</p></noscript></body></html>
