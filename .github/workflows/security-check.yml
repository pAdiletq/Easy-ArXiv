name: Public repository safety

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the release scanner
        run: python3 -m unittest discover -s tests -p test_secret_gate.py
      - name: Check public tree and history without printing values
        run: python3 scripts/check_public_secrets.py --staged --history
