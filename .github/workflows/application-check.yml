name: Application checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci --no-fund
      - run: python -m pip install -r requirements.txt
      - name: Check backend and deployment boundary
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check interface and Cloudflare handlers
        run: node --test tests/test_*.mjs tests/test_*.cjs
      - name: Build the reviewed Pages artifact
        run: python scripts/build_pages.py
